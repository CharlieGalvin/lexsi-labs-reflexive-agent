[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexive-agents"
version = "0.1.0"
description = "Reflexive Agents: a self-healing loop for mitigating agent hallucination (Lexsi Labs hackathon, Track 3)"
requires-python = ">=3.12,<3.14"   # AgentTune needs 3.12+; τ²-bench v2.0.0 needs <3.14. Use 3.12.
dependencies = [
  "pyyaml>=6",
  "tqdm",
  "auditkit",                 # zero required deps; core agent_eval runs on stdlib
]

[project.optional-dependencies]
# AgentTune is installed from source by `just setup`; it pins torch + transformers.
train = ["datasets", "peft", "wandb"]
dev = ["pytest>=8", "pytest-bdd>=7", "ruff>=0.6"]   # pytest-bdd: tests/features/*.feature
# τ²-bench itself is NOT installed from here: a pip install from git leaves out its data/ folder
# (tasks, databases, language packs). `just setup-dev` clones v2.0.0 into third_party/ and
# installs it editable instead. This extra only adds what τ²-bench needs on top.
# audioop-lts: Python 3.13 removed `audioop`, which τ²-bench imports; harmless on 3.12.
bench = [
  "audioop-lts; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
