[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexive-agents"
version = "0.1.0"
description = "Reflexive Agents: a self-healing loop for mitigating agent hallucination (Lexsi Labs hackathon, Track 3)"
requires-python = ">=3.12"   # AgentTune requires 3.12+
dependencies = [
  "pyyaml>=6",
  "tqdm",
  "auditkit",                 # zero required deps; core agent_eval runs on stdlib
]

[project.optional-dependencies]
# AgentTune is installed from source (see README / Makefile), it pins torch + transformers.
train = ["datasets", "peft", "wandb"]
dev = ["pytest>=8", "ruff>=0.6"]
# τ²-bench, pinned to the v2.0.0 release (SEL-31). Gym extra = train/test splits + RL interface.
# audioop-lts: Python 3.13 removed `audioop`, which τ²-bench imports; harmless on 3.12.
bench = [
  "tau2[gym] @ git+https://github.com/sierra-research/tau2-bench.git@v2.0.0",
  "audioop-lts; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
