# Arm S2R64: SFT v2's data, 4 epochs, LoRA rank 64 (Stage 2b step 1b).
# Serve on the pod:  ADAPTER= EXTRA_ADAPTERS="sft2r64=runs/sft-aya32b-v2-e4r64" bash scripts/pod/serve.sh
# Validation, 8 samples (STAGE2.md, Stage 2b):
#   python scripts/arms/val_rollout.py S2R64 configs/sft/arms.s2r64.yaml --from $VALDIR --samples 8 --actions off
# Same harness, prompt, decoding and customer as arms.sft2.yaml; only what the line above says differs.
# Never on test unless the team declares it (Stage 2b's rule).

student:
  name: aya32-sft-v2-e4r64
  model: sft2r64
  api_base: http://localhost:8000/v1
  api_key_env: null
  mode: prompted          # the data contract (SEL-35): don't change these two
  style: cohere
  temperature: 0.0
  max_tokens: 1024
  max_context: 32768      # = serve.sh MAX_LEN
  reserve: 4096
  rpm: 0

customer: null            # GPT-4.1, as for every arm

arms:
  S2R64:
    name: sft-v2-e4r64
    description: "SFT v2's data, 4 epochs, LoRA rank 64 (Stage 2b step 1b)"
    prompt_variant: default
