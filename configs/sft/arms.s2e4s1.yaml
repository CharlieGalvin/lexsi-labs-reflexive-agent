# Arm S2E4S1: S2E4's recipe trained again with seed 1 (Stage 2d, STAGE2.md amended Wed 25 Nov).
# Declared for test, 100 tasks x 8 samples, run once:  bash scripts/pod/night_seed.sh
# Same harness, prompt, decoding and customer as arms.s2e4.yaml; only the adapter differs.

student:
  name: aya32-sft-v2-e4-s1
  model: sft2e4s1
