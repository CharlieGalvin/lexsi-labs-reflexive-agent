# Arm H3: Aya Expanse 32B + SFT v2 + decision GRPO, wrong-only reward, served as "decision3":
#   ADAPTER= EXTRA_ADAPTERS="decision3=runs/grpo-decision-h3-aya32b-v2" just sft-serve
# Same harness, prompt, decoding and customer as S2 and G; only the adapter differs.
# Run on the pod, one arm at a time:
#   just arm-val H3 configs/sft/arms.grpo_decision_h3.yaml                    # the 30 validation tasks, 2 samples
#   just rollout H3 <domain> --split dev --samples 2 --config configs/sft/arms.grpo_decision_h3.yaml
# Test only if H3 passes its validation rule, fixed before any H3 result.

student:
  name: aya32-grpo-decision-h3-v2
  model: decision3
  api_base: http://localhost:8000/v1
  api_key_env: null
  mode: prompted          # the data contract (SEL-35): don't change these two
  style: cohere
  temperature: 0.0
  max_tokens: 1024
  max_context: 32768      # = serve.sh MAX_LEN
  reserve: 4096
  rpm: 0

customer: null            # GPT-4.1, as for every arm

arms:
  H3:
    name: grpo-decision-h3-v2
    description: "SFT v2 + decision GRPO, wrong-only reward, prompts at v2's own wrong changes"
    prompt_variant: default
