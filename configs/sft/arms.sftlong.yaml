# Arm SL: v1's data trained for 74 steps (SEL-71's confound ablation), served as "sftlong":
#   EXTRA_ADAPTERS="sft2=runs/sft-aya32b-r16-v2 sftlong=runs/sft-aya32b-r16-long" just sft-serve
# Same harness, prompt, decoding and customer as configs/arms.yaml; only the student differs:
# it's served by vLLM on the pod (scripts/pod/serve.sh), on localhost:8000, no API key.
# Run on the pod, on the validation tasks (SEL-71). --out names the file `just arm-samples --split val`
# reads (without it, the validation tasks' split, train, names it SL-<domain>-train.jsonl):
#   just rollout SL <domain> --task-ids ... --samples 2 --config configs/sft/arms.sftlong.yaml \
#     --out results/episodes/arms/SL-<domain>-val.jsonl
# Never on test (SEL-71). Everything but the adapter is as in arms.sft.yaml.

student:
  name: aya32-sft-r16-long
  model: sftlong
  api_base: http://localhost:8000/v1
  api_key_env: null
  mode: prompted          # the data contract (SEL-35): don't change these two
  style: cohere
  temperature: 0.0
  max_tokens: 1024
  max_context: 32768      # = serve.sh MAX_LEN (the GPU's limit; Cohere's API allows 128K)
  reserve: 4096
  rpm: 0

customer: null            # GPT-4.1, as for every arm

arms:
  SL:
    name: sft-long-ablation
    description: "v1's data for v2's 74 steps: does v2's gain come from more training? (SEL-71 confound ablation)"
    prompt_variant: default
