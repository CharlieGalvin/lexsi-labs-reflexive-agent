# Stage 2b, round 1 of the self-practice loop (STAGE2.md; SEL-23): v2's recipe exactly (2 epochs,
# rank 16, lr 1e-4), on v2's data plus v2's own verified practice conversations. One change from v2:
# the added practice data. More data at 2 epochs means more steps; S2E4 (v2's data, 4 epochs) is the
# matched-steps control. Build the data, then train on the pod:
#   python scripts/heal/practice.py build && just sft-train configs/train/sft_aya32b_p1.yaml --push

name: sft-aya32b-p1
model: CohereLabs/aya-expanse-32b
data: data/train/sft-p1.jsonl          # v2's file + group "practice" (scripts/heal/practice.py build)
train_group: [healable, extra, practice]
eval_group: solved_by_aya             # the same 15 held-out examples as v1 (no extras for them)
max_len: 16384

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

trainer:
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.0
  optim: paged_adamw_8bit
  logging_steps: 1
  eval_steps: 7
  seed: 0
