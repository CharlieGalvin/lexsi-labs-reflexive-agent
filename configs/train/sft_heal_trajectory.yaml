# A trajectory-level heal cycle's retraining (HEAL_FROM_V2.md): the fixes are the teacher's whole
# verified conversations (cycle.py --fix-mode trajectory), so the settings are SFT v2's
# (configs/train/sft_aya32b_v2.yaml), not the turn-level cycle's. On the pod, the heal service picks it
# with HEAL_TRAIN_CONFIG=configs/train/sft_heal_trajectory.yaml.
#
# The only differences from v2: data is the cycle's fixes (--data, group "heal"), and there's no
# held-out loss (the cycle's fixes have no solved_by_aya examples).

name: heal                         # replaced by --name (the cycle's adapter name)
model: CohereLabs/aya-expanse-32b
data: null                         # always --data
train_group: heal
eval_group: solved_by_aya          # not in a cycle's fixes: no held-out loss
max_len: 16384

lora:                              # a new adapter only; --init-adapter keeps the old one's
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

trainer:
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.0
  optim: paged_adamw_8bit
  logging_steps: 1
  seed: 0
