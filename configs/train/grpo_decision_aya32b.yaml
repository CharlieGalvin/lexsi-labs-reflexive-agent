# Decision GRPO from SFT v2, arm H2: H's heal loop plus a reward that checks each state change
# against τ²-bench's expected actions still pending at that turn (`reflexive.decision_data`).
# Why: 39 of SFT v2's 55 dev and validation failures are wrong decisions about what to change
# (a change nobody asked for, wrong arguments, or a change never made), which H's Tool / Arg /
# Loop rewards can't see.
# Build the prompts:  just grpo-decision-data
# On the pod:         just grpo-train configs/train/grpo_decision_aya32b.yaml --dry-run
#                     just grpo-train configs/train/grpo_decision_aya32b.yaml --max-steps 3 --report-to none
#                     just grpo-train configs/train/grpo_decision_aya32b.yaml --push
#
# Everything but `name`, `data` and `reward_weights` is as in grpo_heal_aya32b.yaml (arm H).

name: grpo-decision-aya32b-v2
model: CohereLabs/aya-expanse-32b
adapter: reagent-lexsi/sft-aya32b-r16-v2   # SFT v2, as for G and H
data: data/train/grpo-decision.jsonl        # `just grpo-decision-data`: H's prompts + decision points
max_prompt_tokens: null

rewards: heal                   # reflexive.heal_rewards, with the decision component
reward_weights:                 # max 5.5; decision is what we optimise, the rest hold v2's behaviour
  tool: 1.0                     # no call to a tool the agent doesn't have
  arg: 1.0                      # no placeholder, invented ID or schema error
  loop: 0.5                     # no repeat of a failed call, no third identical call or reply
  fix: 0.5                      # the teacher's choice and wording (H: 1.0)
  guard: 0.5                    # the call is the whole reply; no giving up unless the teacher did
  decision: 2.0                 # every state change matches a pending expected change; make it where the teacher did

drift_guard:                    # as H
  max_drift: 0.10
  window: 10
  after_step: 20

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

trainer:                        # as H's (grpo_heal_aya32b.yaml)
  max_steps: 100
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  steps_per_generation: 8
  num_generations: 8
  max_completion_length: 384
  temperature: 1.0
  beta: 0.04
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  logging_steps: 1
  save_strategy: steps
  save_steps: 25
  save_total_limit: 4
  log_completions: true
  seed: 0
