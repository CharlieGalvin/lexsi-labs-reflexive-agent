# Stage 2c (STAGE2.md; SEL-121): round 1's data (v2's + v2's own verified practice, data/train/sft-p1.jsonl)
# with S2E4's winning recipe, 4 epochs. One change from S2E4: the 100 practice conversations.
# Train on pod B:  python scripts/sft/train_sft.py configs/train/sft_aya32b_p1_e4.yaml --push

name: sft-aya32b-p1-e4
model: CohereLabs/aya-expanse-32b
data: data/train/sft-p1.jsonl          # v2's file + group "practice" (scripts/heal/practice.py build)
train_group: [healable, extra, practice]
eval_group: solved_by_aya             # the same 15 held-out examples as v1 (no extras for them)
max_len: 16384

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

trainer:
  num_train_epochs: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.0
  optim: paged_adamw_8bit
  logging_steps: 1
  eval_steps: 7
  seed: 0
