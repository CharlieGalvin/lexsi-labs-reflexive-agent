# Run 3: GRPO on Customer Lookup (docs/experiments/GRPO_WARMUP.md). LoRA on Tiny Aya, no vLLM.
# 150 steps x 2 questions = the 320 training questions about once. Expect ~1-2 h on 24 GB.
#   just train configs/train/lookup_grpo.yaml --max-steps 5     # try first
#   just train configs/train/lookup_grpo.yaml
# A starting point, not tuned. If the reward is flat after ~50 steps, try learning_rate 3.0e-5.
task: customer_lookup
task_options:
  l2_share: 0.5                   # share of two-call questions; keep eval_lookup.py --l2-share equal
model: CohereLabs/tiny-aya-global
output_dir: runs/lookup-grpo
reward_weights: {correct: 1.0, tool_ok: 0.5, format: 0.2}   # max reward 1.7

trainer:
  max_steps: 150
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2  # 4 x 2 = 8 rollouts per step = 2 questions x 4 answers
  num_generations: 4              # answers per question; must divide 8
  max_steps_per_turn: 3
  max_completion_length: 768      # all turns of one rollout together
  temperature: 0.8                # sampling diversity: the groups need different rewards
  beta: 0.0                       # no KL penalty (faster, less memory); try 0.04 later
  learning_rate: 1.0e-5           # LoRA; AgentTune's 1e-6 default is for full fine-tuning
  warmup_steps: 5
  logging_steps: 1
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  model_init_kwargs: {dtype: bfloat16}
  use_vllm: false
  peft_config: {r: 16, lora_alpha: 32, target_modules: all-linear, task_type: CAUSAL_LM}
  log_completions: true
  report_to: none                 # or pass --report-to wandb
