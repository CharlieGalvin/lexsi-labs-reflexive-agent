# Run 3b: the same as lookup_grpo.yaml, with vLLM generating the rollouts. Compare seconds per
# step and the reward curve with run 3. Needs vLLM in the venv first:
#   uv pip install --python .venv/bin/python -e 'third_party/AgentTune[vllm]'
# Out of memory? Lower vllm_gpu_memory_utilization to 0.25. If tool calls stop being parsed
# (tool_ok ~0 in rewards.jsonl), the Tiny Aya tool fallback doesn't work on the vLLM path.
base: lookup_grpo.yaml
output_dir: runs/lookup-grpo-vllm
trainer:
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3   # share of the 24 GB for vLLM; training gets the rest
  vllm_max_model_length: 4096
