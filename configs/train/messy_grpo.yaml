# The starter task: GRPO on Messy-ID Lookup (docs/experiments/MESSY_LOOKUP.md). One tool call
# per question; the skill is getting the ID argument right. LoRA on Tiny Aya, logged to W&B.
#   just baseline        # Arm A (untuned) -> results/base.metrics.json + EXPERIMENTS.md row
#   just after           # this config -> runs/messy-grpo
#   just evaluate        # -> results/messy-grpo.metrics.json + EXPERIMENTS.md row
#   just compare         # base vs messy-grpo table
task: messy_lookup
task_options:
  styles:                         # weights of the question types; tune after the baseline
    clean: 1
    lower_dash: 1
    spaced: 1
    number_only: 1
    spelled: 1
    distractor: 1
model: CohereLabs/tiny-aya-global
output_dir: runs/messy-grpo
reward_weights: {correct: 1.0, tool_ok: 0.5, format: 0.2}   # max reward 1.7

trainer:                          # passed unchanged to create_agentic_trainer("grpo", ...)
  max_steps: 100                  # x 2 questions = 200 of the 480 training questions
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4  # 2 x 4 = 8 rollouts per step = 2 questions x 4 answers
  num_generations: 4              # the "group": answers per question
  max_steps_per_turn: 2           # one call, plus one retry after an error
  max_completion_length: 512
  temperature: 0.8                # sampling diversity: the groups need different rewards
  beta: 0.04                      # KL penalty: keeps the model near the base; gives a "kl" chart
  learning_rate: 1.0e-5           # LoRA; if the reward is flat after ~40 steps, try 3.0e-5
  lr_scheduler_type: constant_with_warmup   # a flat learning rate: easier to read the curves
  warmup_steps: 5
  logging_steps: 1
  save_steps: 25
  save_total_limit: 4
  bf16: true
  gradient_checkpointing: true
  model_init_kwargs: {dtype: bfloat16}
  use_vllm: false
  peft_config: {r: 16, lora_alpha: 32, target_modules: all-linear, task_type: CAUSAL_LM}
  log_completions: true           # sample rollouts as a table in W&B
  report_to: wandb                # project "reagent-trainer" unless WANDB_PROJECT is set
