# Single-turn GRPO from SFT v2 (SEL-21): Aya Expanse 32B in 4-bit, continuing SFT v2's LoRA adapter.
# Build the prompts:  just grpo-data && just grpo-reward-check
# On the pod:         just grpo-train --dry-run      # tokenise and report (no GPU)
#                     just grpo-train --max-steps 2 --report-to none   # smoke run
#                     just grpo-train --push         # the run (SEL-49 evaluates it on dev)
#
# Each prompt is a conversation up to one of the teacher's tool-call turns; the model samples
# that turn num_generations times, and reflexive.grpo_rewards scores each sample against the
# teacher's turn. No customer simulator, no tools run: one reply per sample.
#
# Watch out: the prompts come from the conversations SFT v2 trained on, so on some prompts every
# sample may already match the teacher. Such groups score the same and teach nothing: watch
# `frac_reward_zero_std` in W&B (the share of such groups). Near 1 → raise temperature, or train
# on the turns SFT v2 still gets wrong.

name: grpo-aya32b-v2
model: CohereLabs/aya-expanse-32b
adapter: reagent-lexsi/sft-aya32b-r16-v2   # SFT v2 (21.5/36 on dev): GRPO trains this adapter further
data: data/train/grpo-healable.jsonl        # `just grpo-data`: 721 prompts, train tasks only

quantization:                   # as SFT trained it: the adapter learned on the 4-bit base
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

reward_weights:                 # reflexive.grpo_rewards.DEFAULT_WEIGHTS: maximum 3.7
  tool_match: 1.0
  args_match: 1.0
  valid_call: 0.5
  grounded: 0.5
  format: 0.2
  no_give_up: 0.5

trainer:                        # passed to TRL's GRPOConfig
  max_steps: 100                # x 2 prompts = 200 of the 721; ~2–3 min/step expected on an H100
  per_device_train_batch_size: 1          # one ~7K-token sequence through the backward pass at a time
  gradient_accumulation_steps: 16         # 16 samples per step = 2 prompts x 8 samples
  num_generations: 8            # the "group": samples per prompt, compared with each other
  max_completion_length: 384    # the teacher's turns: 95% under ~100 tokens, the longest ~500
  temperature: 1.0              # diversity: SFT v2 already knows these turns, the groups need spread
  beta: 0.04                    # KL to SFT v2 (TRL copies the adapter as the reference): a "kl" chart
  learning_rate: 1.0e-5         # LoRA; SFT used 1e-4, GRPO updates are kept gentler
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  logging_steps: 1
  save_strategy: steps
  save_steps: 25
  save_total_limit: 4
  log_completions: true         # sample completions as a table in W&B
  seed: 0
