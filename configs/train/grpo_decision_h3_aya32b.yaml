# Decision GRPO, arm H3: H2 changed where its training logs say the signal went (diagnose_run.py):
# * 76% of H2's prompt groups had no variance in the decision reward, and decision carried only
#   about a third of the weighted within-group differences; tool and arg carried most, from invalid
#   calls sampled at temperature 1.0 that v2 rarely makes when served at temperature 0;
# * the decision reward paid for acting (1.0 against 0.4 for holding off), and calls went 50% -> 80%.
# Changes: (1) prompts focused on where H2's samples disagreed about what to change, twice each
# (build_grpo_focus_data.py); (2) wrong-only decision reward; (3) decision 3.0, tool and arg 0.5;
# (4) sampling temperature 0.8; (5) 50 steps.
# Build:      python scripts/data/build_grpo_focus_data.py runs/grpo-decision-aya32b-v2 --total 100
# On the pod: python scripts/grpo/train_single_turn.py configs/train/grpo_decision_h3_aya32b.yaml --push
#
# Everything else is as H2 (grpo_decision_aya32b.yaml), with a checkpoint every 10 steps.

name: grpo-decision-h3-aya32b-v2
model: CohereLabs/aya-expanse-32b
adapter: reagent-lexsi/sft-aya32b-r16-v2   # SFT v2, as for G and H
data: data/train/grpo-decision-h3.jsonl     # build_grpo_focus_data.py runs/grpo-decision-aya32b-v2 --total 100
max_prompt_tokens: null

rewards: heal                   # reflexive.heal_rewards, with the decision component
reward_weights:                 # max 5.5; decision is what we optimise, the rest hold v2's behaviour (H3: tool, arg 0.5; decision 3.0)
  tool: 0.5                     # no call to a tool the agent doesn't have
  arg: 0.5                      # no placeholder, invented ID or schema error
  loop: 0.5                     # no repeat of a failed call, no third identical call or reply
  fix: 0.5                      # the teacher's choice and wording (H: 1.0)
  guard: 0.5                    # the call is the whole reply; no giving up unless the teacher did
  decision: 3.0                 # wrong_only (in the data): a state change matching nothing pending scores 0, all else 1

drift_guard:                    # as H
  max_drift: 0.10
  window: 10
  after_step: 20

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

trainer:                        # as H's (grpo_heal_aya32b.yaml)
  max_steps: 50
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  steps_per_generation: 8
  num_generations: 8
  max_completion_length: 384
  temperature: 0.8             # H2: 1.0, whose invalid calls took most of the signal
  beta: 0.04
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  logging_steps: 1
  save_strategy: steps
  save_steps: 10
  save_total_limit: 4
  log_completions: true
  seed: 0
