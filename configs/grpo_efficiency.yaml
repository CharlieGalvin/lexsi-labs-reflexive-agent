# Baseline experiment: GRPO on BioGRID SQL QA with efficiency + groundedness rewards.
# Copy this file for each new experiment (configs/exp_<initials>_<idea>.yaml) and log
# the run in docs/EXPERIMENTS.md. Override on the CLI: train.max_steps=10

run_name: grpo-eff-v0
seed: 42

model:
  # Cohere Labs dense open-weights model (gated: accept the licence on the Hub, then `hf auth login`).
  # No Cohere model ships a tool-rendering chat template; AgentTune falls back to a JSON-list
  # tool prompt automatically (see AgentTune README, "Tool calling with Cohere models").
  base: CohereLabs/tiny-aya-global

data:
  hf_dataset: qgallouedec/biogrid_qa
  question_prefix: "Does the gene "   # yes/no subset used in AgentTune's example
  n_eval: 200                          # held out, never trained on
  n_train: 2000
  unanswerable_fraction: 0.15          # hallucination probes mixed into both splits
  seed: 42

tools: [query_biogrid]

rewards:
  weights:            # set a weight to 0 to ablate a term
    correctness: 1.0
    efficiency: 0.5
    groundedness: 0.5
    tool_validity: 0.2
  efficiency_kwargs:
    step_budget: 3
    min_calls: 1
    dup_penalty: 0.3
    error_penalty: 0.2
    over_budget_penalty: 0.15

train:              # forwarded to agenttune create_agentic_trainer(...) / TRL GRPOConfig
  algorithm: grpo
  output_dir: runs/grpo-eff-v0
  max_steps: 300
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-6
  num_generations: 4
  max_completion_length: 1024
  max_steps_per_turn: 6
  use_vllm: false                    # true on Linux+CUDA with `pip install -e '.[vllm]'` in AgentTune
  log_completions: true
  report_to: wandb                   # or "trackio" / "none"
  peft_config: {r: 16, lora_alpha: 32, target_modules: all-linear, task_type: CAUSAL_LM}
  push_to_hub: false
  hub_model_id: null                 # e.g. <team-org>/tiny-aya-lean-agent

eval:
  max_steps: 6
  max_new_tokens: 512
  temperature: 0.0
  auditkit_scorers:
    - redundant_tool_calls
    - agent_loop_detection
    - tool_call_validity
    - tool_selection
